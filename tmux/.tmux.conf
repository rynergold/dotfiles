# ── Sensible defaults ──────────────────────────────────────────────
set -g mouse on
set -g default-terminal "tmux-256color"
# Reset to tmux's defaults, then add 24-bit colour; safe to reload without duplicates
set -su terminal-features
set -sa terminal-features ",xterm*:RGB"
# Run non-login interactive shell so /etc/zprofile and ~/.zprofile are not re-executed on every tab/pane
set -g default-command "${SHELL}"
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-passthrough on

set -s escape-time 0
set -s extended-keys on
set -s extended-keys-format csi-u
set -g repeat-time 600

# ── Prefix: keep C-b (do NOT remap to C-a) ─────────────────────────
# C-a is used elsewhere, leaving the default prefix in place.
unbind C-a

# ── Reload config ──────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ── Pane Navigation (Single action: NO bounce-back / repeat trap) ──
bind-key Left select-pane -L
bind-key Right select-pane -R
bind-key Up select-pane -U
bind-key Down select-pane -D
bind-key h select-pane -L
bind-key l select-pane -R
bind-key k select-pane -U
bind-key j select-pane -D

# ── Windows & Pane Splits (inherit current directory) ──────────────
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# ── Vi copy mode & Message Navigation ──────────────────────────────
setw -g mode-keys vi
set -s set-clipboard on

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Jump directly out of prompt input box into copy mode (step backwards manually with k / Ctrl-u)
bind-key u copy-mode \; send-keys -X cursor-up

# Navigate between previous / next messages inside copy mode (like Vim folds)
bind-key -T copy-mode-vi [ send-keys -X search-backward "^([>❯] )"
bind-key -T copy-mode-vi ] send-keys -X search-forward "^([>❯] )"

# ── Switcher (tmux-sessionizer) ────────────────────────────────────
# One picker for open sessions, their windows, and saved projects (~/.config/tmux-projects).
bind-key f display-popup -E -w 100% -h 100% "$HOME/.local/bin/tmux-sessionizer"
bind-key C-f display-popup -E -w 100% -h 100% "$HOME/.local/bin/tmux-sessionizer"
bind-key s display-popup -E -w 100% -h 100% "$HOME/.local/bin/tmux-sessionizer"
bind-key C-s display-popup -E -w 100% -h 100% "$HOME/.local/bin/tmux-sessionizer"
unbind-key w

# Ctrl-b S: Classic tmux choose-tree (fallback)
bind-key S choose-tree -Zs

# ── Pane Resizing (Repeatable: prefix once, then tap H/J/K/L) ───────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Window & Session Management ────────────────────────────────────
# Don't exit tmux when closing/killing a session; switch to next open session
set -g detach-on-destroy off
# Ctrl-b N: Prompt for a session name and switch to it immediately in root/home directory (~/)
bind-key N command-prompt -p "New session name:" "new-session -A -s '%%' -c '$HOME'"
# Ctrl-b X: Kill current tab (window and all its panes)
bind-key X confirm-before -p "kill-window #W? (y/n)" kill-window
# Ctrl-b C-x: Kill current project session
bind-key C-x confirm-before -p "kill-session #S? (y/n)" kill-session



# ── Status Bar Styling (TokyoNight Moon theme - Workspace Header at Top) ──
set -g status-position top
set -g status-style "bg=#1e2030,fg=#828bb8"
set -g status-left "#[fg=#82aaff,bold] #S #[fg=#444a73]│ "
set -g status-left-length 40
set -g status-right ""
set -g status-right-length 0
setw -g window-status-current-style "fg=#c8d3f5,bold,bg=#2f334d"
setw -g window-status-current-format " #I:#W* "
setw -g window-status-style "fg=#828bb8"
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#2f334d"
set -g pane-active-border-style "fg=#82aaff"

# ── Plugins (TPM) ──────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Init TPM (if installed)
if-shell "test -f ~/.tmux/plugins/tpm/tpm" "run '~/.tmux/plugins/tpm/tpm'"
