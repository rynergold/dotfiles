# ── Sensible defaults ──────────────────────────────────────────────
set -g mouse on
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -s escape-time 0
set -s extended-keys on
set -g repeat-time 600

# ── Prefix: keep C-b (do NOT remap to C-a) ─────────────────────────
# C-a is used elsewhere, leaving the default prefix in place.
unbind C-a

# ── Reload config ──────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ── Pane Navigation (Single action: NO bounce-back / repeat trap) ──
bind-key Left select-pane -L
bind-key Right select-pane -R
bind-key Up select-pane -U
bind-key Down select-pane -D
bind-key h select-pane -L
bind-key l select-pane -R
bind-key k select-pane -U
bind-key j select-pane -D

# ── Pane Splits (50/50 side-by-side or stacked in current directory) ──
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# ── Vi copy mode & Message Navigation ──────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Jump directly to top of latest prompt / Anti message (from anywhere)
bind-key u copy-mode \; send-keys -X cursor-up \; send-keys -X search-backward "^> "

# Navigate between previous / next messages inside copy mode (like Vim folds)
bind-key -T copy-mode-vi [ send-keys -X search-backward "^> "
bind-key -T copy-mode-vi ] send-keys -X search-forward "^> "

# ── Project Switcher (tmux-sessionizer) ────────────────────────────
bind-key f display-popup -E -w 85% -h 75% "$HOME/.local/bin/tmux-sessionizer"
bind-key C-f display-popup -E -w 85% -h 75% "$HOME/.local/bin/tmux-sessionizer"

# ── Pane Resizing (Repeatable: prefix once, then tap H/J/K/L) ───────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Session Management ─────────────────────────────────────────────
# Ctrl-b N: Prompt for a session name and switch to it immediately
bind-key N command-prompt -p "New session name:" "new-session -A -s '%%'"
# Ctrl-b X: Kill current session
bind-key X confirm-before -p "kill-session #S? (y/n)" kill-session


# ── Status Bar Styling (TokyoNight Moon theme - Workspace Header at Top) ──
set -g status-position top
set -g status-style "bg=#1e2030,fg=#828bb8"
set -g status-left "#[fg=#82aaff,bold] #S #[fg=#444a73]│ "
set -g status-left-length 40
set -g status-right ""
set -g status-right-length 0
setw -g window-status-current-style "fg=#c8d3f5,bold,bg=#2f334d"
setw -g window-status-current-format " #I:#W* "
setw -g window-status-style "fg=#828bb8"
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#2f334d"
set -g pane-active-border-style "fg=#82aaff"

# ── Plugins (TPM) ──────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Init TPM (if installed)
if-shell "test -f ~/.tmux/plugins/tpm/tpm" "run '~/.tmux/plugins/tpm/tpm'"
